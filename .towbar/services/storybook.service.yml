# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: oss-design-system-cosmos
name: OSS Design System
description: Shared components and patterns in the Storybook catalogue.
deployment:
  type: dockerfile
  context: .
  dockerfile: infra/storybook/Dockerfile
  target: runtime
  architecture: arm64
  resources:
    cpus: 1
    memory: 4g
autoDeploy: false
container:
  port: 8080
  resources:
    cpus: 0.25
    memory: 256m
health:
  type: http
  path: /
  timeoutSeconds: 60
ingress:
  type: proxy
domains:
  primary: oss-ds.avgeek.ltd
tls:
  mode: cloudflare-dns
  proxied: false
environments:
  production:
    server: 13.206.149.158
